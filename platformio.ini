; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:genericCH32V006F8U6]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = ch32v003fun
monitor_speed = 115200
board = genericCH32V006F8U6
build_flags = -lc -Os
build_src_filter = +<*> -<esp32/>
; Generate .bin after build
extra_scripts = post:make_firmware_bin.py

; ESP32 port (air_monitor board: ST7789 240x320 + ADC GPIO35)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32/> +<decode.cpp>
lib_deps = lovyan03/LovyanGFX@^1.2.7
