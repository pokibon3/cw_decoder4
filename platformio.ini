; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32 CW Decoder (2.8inch CYD: ST7789/ILI9341 240x320 + XPT2046 + ADC GPIO35)
;
; LCD コントローラごとに environment を分けてある。両方の firmware.bin を
; 並べて作れるので、OTA 用に配るときに取り違えない。ビルド先は
;   ST7789  -> .pio/build/esp32dev/firmware.bin
;   ILI9341 -> .pio/build/esp32dev_ili9341/firmware.bin
;
;   pio run                        既定 (ST7789) だけをビルド
;   pio run -e esp32dev_ili9341    ILI9341 をビルド
;   pio run -e esp32dev -e esp32dev_ili9341    両方
;
; 焼くパネルと一致しない bin を書き込むと、表示の基準面が 180° ずれて
; タッチの回転補正も連動して狂うので注意。起動時にシリアル (115200) へ
; [lcd] panel = ... と判定結果が出るので、そこで確認できる。

[platformio]
default_envs = esp32dev

; 両 environment 共通の設定
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@^1.2.7
; OTA (無線更新) のため app0/app1 を 1.875MB ずつ確保する。
; 既定の default.csv (app 1.25MB) には WiFi + WebServer + Update を積んだ
; 本体が収まらない。パーティション構成は USB 書き込みでしか変わらないので、
; この変更後は一度 USB で書き込むこと (以後は OTA で更新できる)。
board_build.partitions = min_spiffs.csv

; 既定。手元の実機はこちら
[env:esp32dev]
build_flags = -DPANEL_ST7789

; ILI9341 のボード用
; (ILI9341 は ID 読み出しに応答しない個体があり起動時の自動判定ができないため、
;  無指定の自動判定には頼らず明示指定する)
[env:esp32dev_ili9341]
build_flags = -DPANEL_ILI9341
