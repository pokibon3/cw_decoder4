; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ESP32 CW Decoder (2.8inch CYD: ST7789/ILI9341 240x320 + XPT2046 + ADC GPIO35)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@^1.2.7
; OTA (無線更新) のため app0/app1 を 1.875MB ずつ確保する。
; 既定の default.csv (app 1.25MB) には WiFi + WebServer + Update を積んだ
; 本体が収まらない。パーティション構成は USB 書き込みでしか変わらないので、
; この変更後は一度 USB で書き込むこと (以後は OTA で更新できる)。
board_build.partitions = min_spiffs.csv
; LCDコントローラの選択:
;   無指定    -> 起動時に自動判定 (ST7789 / ILI9341)
;   ILI9341 は ID 読み出しに応答しない個体があり自動判定できないため、
;   その場合は明示指定する。ST7789 ボードは -DPANEL_ST7789 でもよい。
;build_flags = -DPANEL_ILI9341
;build_flags = -DPANEL_ST7789
