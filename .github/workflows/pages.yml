# web/ を GitHub Pages に公開する。
#
# ブランチから公開する方式はルートか /docs しか選べないので、
# ディレクトリ名を web/ のまま保つために Actions で成果物を組み立てる。
#
# cwcore.wasm はビルド済みでリポジトリに入れてあるので、ここではビルドせず
# そのまま配る (ビルドには wasm-ld が要る。web/build.sh を参照)。
#
# 本体の「自動更新」用の配布物もここから配る。目録は
# web/firmware/latest.txt (tools/make_release.sh が作る)、bin はそこに
# 書かれた版の tools/v<版>/ から取る (リポジトリに二重で持たせないため)。
#
# USB 書き込みツール (web/flasher/) 用に、tools/v<版>/ の全版と共通の
# ブートローダー類 (tools/common/)、版の目録 versions.json も配る
# (tools/make_versions.py)。目録の日付は git の履歴から取るので、
# checkout は履歴ごと取る。
#
# 公開後の URL: https://pokibon3.github.io/cw_decoder4/
#               https://pokibon3.github.io/cw_decoder4/firmware/latest.txt
#               https://pokibon3.github.io/cw_decoder4/flasher/
name: Deploy web to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/v*/**'
      - 'tools/common/**'
      - 'tools/make_versions.py'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # 手動実行も可

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のデプロイは終わらせてから次を流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # versions.json の日付 (bin を追加したコミット) に要る

      - name: 配布物を組み立てる
        run: |
          mkdir -p _site
          # 実行に要るものだけを置く (C ソースやビルド用スクリプトは配らない)
          cp web/index.html web/manual.html web/app.js web/cw-worklet.js web/cwcore.wasm _site/
          # 単一ファイル版も置く (他所へ 1 枚だけ持っていきたいとき用)
          python3 web/bundle.py
          cp web/cw-decoder.html _site/
          # USB 書き込みツールと、それが読む全版の bin・目録
          mkdir -p _site/flasher/vendor
          cp web/flasher/index.html web/flasher/flasher.js web/flasher/md5.js _site/flasher/
          cp -R web/flasher/vendor/esptool-js-* _site/flasher/vendor/
          python3 tools/make_versions.py _site
          # 本体の「自動更新」が見にくる配布物。bin はリポジトリに二重で
          # 持たせず、latest.txt に書かれた版の tools/v<版>/ から配る
          if [ -f web/firmware/latest.txt ]; then
            VER=$(sed -n 's/^version=//p' web/firmware/latest.txt)
            mkdir -p _site/firmware
            cp web/firmware/latest.txt _site/firmware/
            cp "tools/v$VER"/firmware_ST7789.bin  _site/firmware/
            cp "tools/v$VER"/firmware_ILI9341.bin _site/firmware/
          fi
          ls -lR _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
